name: Task
description: Technical, infrastructure, documentation, or maintenance work
title: "[Task]: "
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What concrete result must this task produce?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Included and explicitly excluded work.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: Completion criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies or risks
