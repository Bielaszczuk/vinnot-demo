name: Release Security

on:
  workflow_call:
    inputs:
      backend:
        type: boolean
        default: true
      web:
        type: boolean
        default: true
      mobile:
        type: boolean
        default: true
      native:
        type: boolean
        default: true
      docs:
        type: boolean
        default: true
      scan_image:
        type: boolean
        default: true
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'

permissions:
  contents: read

jobs:
  android-security:
    name: Android native release dependencies
    if: github.event_name == 'schedule' || github.workflow == 'Release Security' || inputs.native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_API_BASE_URL: https://api-dev.vinnot.com/api
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Resolving the release graph takes minutes and only changes with the native inputs, so a
      # pull request reuses the lockfile resolved for the same inputs during the same ISO week.
      # Standalone sweeps (weekly and manual) always resolve from scratch and only seed the cache.
      # Trivy scans the lockfile on every run, so new advisories are still caught.
      - name: Key the Android lockfile on the week
        id: week
        run: echo "iso=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Look up the lockfile resolved for these native inputs
        id: lockfile
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/android-release-lockfile
          # Same scope as the native classification in scripts/ci-impact.mjs: every mobile file except
          # screens, assets and test fixtures, so autolinking (react-native.config.js), .npmrc and the
          # install backports all change the key.
          key: android-release-lockfile-v2-${{ steps.week.outputs.iso }}-${{ hashFiles('frontend-mobile/**', '!frontend-mobile/src/**', '!frontend-mobile/app/**', '!frontend-mobile/assets/**', '!frontend-mobile/__mocks__/**', '!frontend-mobile/scripts/test/**', '.github/workflows/security-checks.yml') }}
          lookup-only: ${{ github.workflow == 'Release Security' }}
      - name: Choose fresh resolution or the cached lockfile
        id: graph
        env:
          STANDALONE: ${{ github.workflow == 'Release Security' }}
          CACHE_HIT: ${{ steps.lockfile.outputs.cache-hit == 'true' }}
        run: |
          if [[ "$STANDALONE" == true || "$CACHE_HIT" != true ]]; then
            echo "resolve=true" >> "$GITHUB_OUTPUT"
          else
            echo "resolve=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Native inputs unchanged this week: scanning the cached release lockfile instead of resolving it again."
          fi
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: ${{ steps.graph.outputs.resolve == 'true' && 'npm' || '' }}
          cache-dependency-path: frontend-mobile/package-lock.json
      - name: Set up Java for Android
        if: steps.graph.outputs.resolve == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            frontend-mobile/package-lock.json
            frontend-mobile/app.config.ts
            frontend-mobile/plugins/**
            frontend-mobile/scripts/*.gradle
      - name: Install checksum-verified scanners
        run: |
          node scripts/install-security-tools.mjs "$RUNNER_TEMP/security-bin" trivy
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"
          mkdir -p security-reports
      - name: Install mobile dependencies
        if: steps.graph.outputs.resolve == 'true'
        working-directory: frontend-mobile
        run: npm ci
      - name: Generate Android project without release credentials
        if: steps.graph.outputs.resolve == 'true'
        working-directory: frontend-mobile
        run: npx --no-install expo prebuild --platform android --clean --no-install
      - name: Resolve and lock actual release runtime graph
        if: steps.graph.outputs.resolve == 'true'
        working-directory: frontend-mobile/android
        env:
          LOCKFILE_CACHE: ${{ runner.temp }}/android-release-lockfile
        run: |
          ./gradlew --no-daemon --init-script ../scripts/lock-android-dependencies.gradle :app:vinnotLockReleaseDependencies --write-locks
          test -s app/gradle.lockfile
          cp app/gradle.lockfile ../../security-reports/android.gradle.lockfile
          mkdir -p "$LOCKFILE_CACHE"
          cp app/gradle.lockfile "$LOCKFILE_CACHE/gradle.lockfile"
      - name: Restore the cached release lockfile
        if: steps.graph.outputs.resolve == 'false'
        env:
          LOCKFILE_CACHE: ${{ runner.temp }}/android-release-lockfile
        run: |
          test -s "$LOCKFILE_CACHE/gradle.lockfile"
          mkdir -p frontend-mobile/android/app
          cp "$LOCKFILE_CACHE/gradle.lockfile" frontend-mobile/android/app/gradle.lockfile
          cp "$LOCKFILE_CACHE/gradle.lockfile" security-reports/android.gradle.lockfile
      - name: Scan Android native dependencies
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output security-reports/android.json frontend-mobile/android/app/gradle.lockfile
      - name: Preserve native dependency inventory and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-reports/
          retention-days: 14
          if-no-files-found: error

  release-security:
    name: Dependencies, history and container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout full history without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Set up Java for Maven dependency resolution
        if: github.event_name == 'schedule' || github.workflow == 'Release Security' || inputs.backend
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test security tooling for standalone sweeps
        if: github.workflow == 'Release Security'
        run: node --test scripts/test/*security*.test.mjs

      # Inside CI, Repository checks already scans the full history with gitleaks.
      - name: Install only the required checksum-verified scanners
        env:
          STANDALONE: ${{ github.event_name == 'schedule' || github.workflow == 'Release Security' }}
          SCAN_BACKEND: ${{ github.event_name == 'schedule' || github.workflow == 'Release Security' || inputs.backend }}
        run: |
          scanners=()
          if [[ "$STANDALONE" == true ]]; then scanners+=(gitleaks); fi
          if [[ "$SCAN_BACKEND" == true ]]; then scanners+=(trivy); fi
          if (( ${#scanners[@]} )); then
            node scripts/install-security-tools.mjs "$RUNNER_TEMP/security-bin" "${scanners[@]}"
          fi
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"
          mkdir -p security-reports

      - name: Install and verify mobile security backports
        if: github.event_name == 'schedule' || github.workflow == 'Release Security' || inputs.mobile
        working-directory: frontend-mobile
        run: |
          npm ci
          node scripts/apply-security-backports.mjs --verify
          node --test scripts/test/security-backports.test.mjs

      - name: Install and verify documentation site security backports
        if: github.event_name == 'schedule' || github.workflow == 'Release Security' || inputs.docs
        working-directory: docs-site
        run: |
          npm ci
          node ../frontend-mobile/scripts/apply-security-backports.mjs --project docs-site --verify

      - name: Audit affected npm dependencies including build and test
        env:
          AUDIT_WEB: ${{ github.event_name == 'schedule' || github.workflow == 'Release Security' || inputs.web }}
          AUDIT_MOBILE: ${{ github.event_name == 'schedule' || github.workflow == 'Release Security' || inputs.mobile }}
          AUDIT_DOCS: ${{ github.event_name == 'schedule' || github.workflow == 'Release Security' || inputs.docs }}
        run: |
          status=0
          for project in frontend-react frontend-mobile docs-site; do
            if [[ "$project" == frontend-react && "$AUDIT_WEB" != true ]]; then continue; fi
            if [[ "$project" == frontend-mobile && "$AUDIT_MOBILE" != true ]]; then continue; fi
            if [[ "$project" == docs-site && "$AUDIT_DOCS" != true ]]; then continue; fi
            node scripts/audit-npm-dependencies.mjs "$project" security-reports || status=1
          done
          exit "$status"

      - name: Scan full Git history (redacted)
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.workflow == 'Release Security') }}
        run: gitleaks git --redact --no-banner --log-opts="--all" --report-format json --report-path security-reports/secrets.json .

      - name: Resolve Maven dependencies before source scanning
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.workflow == 'Release Security' || inputs.backend) }}
        run: mvn -B -ntp -f backend/pom.xml dependency:resolve

      - name: Scan Maven source dependency graph
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.workflow == 'Release Security' || inputs.backend) }}
        run: trivy fs --scanners vuln --offline-scan --skip-dirs backend/target --severity HIGH,CRITICAL --exit-code 1 --format json --output security-reports/maven.json backend

      # A build-stage cache miss writes the Maven layers twice; with the image and Trivy's Java DB
      # (about 1 GB, several GB unpacked) the runner disk fills up. Drop toolchains this job never uses.
      - name: Free runner disk for the image build and scan
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.workflow == 'Release Security' || (inputs.backend && inputs.scan_image)) }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /

      - name: Set up Docker Buildx for the candidate image
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.workflow == 'Release Security' || (inputs.backend && inputs.scan_image)) }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Only the Maven build stage is cached, keyed on its inputs; the runtime stage and its OS
      # packages are always rebuilt. Standalone sweeps build from scratch and only seed the cache.
      - name: Look up the backend build-stage cache
        id: build-cache
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.workflow == 'Release Security' || (inputs.backend && inputs.scan_image)) }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/backend-build-cache
          key: backend-image-build-v1-${{ hashFiles('backend/pom.xml', 'backend/Dockerfile', 'backend/.dockerignore') }}
          lookup-only: ${{ github.workflow == 'Release Security' }}

      - name: Build candidate image without publishing
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.workflow == 'Release Security' || (inputs.backend && inputs.scan_image)) }}
        env:
          BUILD_CACHE: ${{ runner.temp }}/backend-build-cache
          CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit == 'true' }}
          STANDALONE: ${{ github.workflow == 'Release Security' }}
        run: |
          set -euo pipefail
          cache_from=()
          if [[ "$CACHE_HIT" != true ]]; then
            docker buildx build --pull --target build --cache-to "type=local,dest=${BUILD_CACHE},mode=max" backend
          elif [[ "$STANDALONE" != true ]]; then
            cache_from=(--cache-from "type=local,src=${BUILD_CACHE}")
          fi
          docker buildx build --pull "${cache_from[@]}" --tag "vinnot-security:${GITHUB_SHA}" --load backend

      - name: Scan packaged Java and OS dependencies
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.workflow == 'Release Security' || (inputs.backend && inputs.scan_image)) }}
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --timeout 20m --format json --output security-reports/image.json vinnot-security:${{ github.sha }}

      - name: Export candidate SBOM
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.workflow == 'Release Security' || (inputs.backend && inputs.scan_image)) }}
        run: trivy image --format cyclonedx --output security-reports/backend.cdx.json vinnot-security:${{ github.sha }}

      - name: Preserve security reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-reports/
          retention-days: 14
          if-no-files-found: error
