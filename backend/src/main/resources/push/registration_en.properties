status.REQUESTED.title=Registration received
status.REQUESTED.body={event}: the organizer will review your request and let you know.
status.AWAITING_PAYMENT.title=Complete your payment
status.AWAITING_PAYMENT.body={event}: your place is held while you complete the payment.
status.AWAITING_ATTENDEE_CONFIRMATION.title=Confirm your place
status.AWAITING_ATTENDEE_CONFIRMATION.body={event}: a place is available for you. Confirm it to keep it.
status.CONFIRMED.title=Registration confirmed
status.CONFIRMED.body={event}: your ticket is ready in the app.
status.WAITLISTED.title=You are on the waiting list
status.WAITLISTED.body={event}: we will let you know if a place becomes available.
status.REJECTED.title=Registration not accepted
status.REJECTED.body={event}: the organizer could not accept this request.
status.CANCELLED.title=Registration cancelled
status.CANCELLED.body={event}: your registration has been cancelled.
status.EXPIRED.title=Reservation expired
status.EXPIRED.body={event}: the time to complete your reservation has run out.
payment.REJECTED.title=Payment declined
payment.REJECTED.body={event}: the payment could not be completed. Check your ticket for next steps.
payment.REPORTED.title=Payment under review
payment.REPORTED.body={event}: the organizer will confirm your payment shortly.
payment.REFUNDED.title=Payment refunded
payment.REFUNDED.body={event}: your payment has been refunded.
update.title=Registration update
update.body={event}: there is an update on your registration.
