# Defaults the PostgreSQL driver reads for every test connection (Hikari, Flyway and plain DriverManager alike).
# A Docker connection that drops makes a test fail in seconds instead of hanging the build.
# Test resources only: production connections are not affected.
# Seconds to open the TCP connection.
connectTimeout=10
# Seconds for the whole login, including the authentication handshake.
loginTimeout=15
# Seconds a single read may wait; well above the slowest test query.
socketTimeout=120
